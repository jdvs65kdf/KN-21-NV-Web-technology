<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список користувачів — Варіант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>📋 Список користувачів</h2>

    <table id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Дані додаються через script.js -->
        </tbody>
    </table>

    <button class="btn btn-update" onclick="fetchUsers()">🔄 Оновити</button>

    <hr>

    <div class="form-container">
        <h3 class="form-title">➕ Додати нового користувача</h3>
        <div class="form-group">
            <label>Ім'я:</label>
            <input type="text" id="newName" placeholder="Введіть ім'я">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="newEmail" placeholder="Введіть email">
        </div>
        <button class="btn btn-add" onclick="addUser()">✅ Додати користувача</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
