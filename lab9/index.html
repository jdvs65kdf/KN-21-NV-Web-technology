<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Варіант 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📌 To-Do List</h1>
        
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Введіть завдання">
            <button id="addBtn" class="blue-btn">+ Додати</button>
        </div>

        <div class="controls">
            <button onclick="sortAlphabet()" class="blue-btn">🔤 Сортувати за алфавітом</button>
            <button onclick="sortDate()" class="blue-btn">📅 Сортувати за датою</button>
            <button onclick="filterTasks('done')" class="green-btn">✅ Показати виконані</button>
            <button onclick="filterTasks('active')" class="red-btn">❌ Показати невиконані</button>
            <button onclick="filterTasks('all')" class="blue-btn">🔄 Показати всі</button>
        </div>

        <ul id="todoList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
